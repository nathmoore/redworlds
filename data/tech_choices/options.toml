matrix_target = ["Y", "F_Y"]
budget_musd_2026_purchaser = 330_000
build_years_reference = 0
max_replaceable_fraction = 0.8
direct_emissions_extension = "impacts"
direct_emissions_driver = "Motor Gasoline"
direct_emissions_share = 0.329
deployment_curve = "swap_default"
cover_magnitude = { cars = 11_000_000, tonnes_saved_per_car_year = 2 }
ceiling_cover_key = "cars"
regional_ceiling = 320_000_000
regional_ceiling_unit = "cars that could be electrified"
regional_ceiling_basis = """
The regional fleet, less the share that cannot realistically electrify this window (heavy
rural use, and drivers without off-street parking in markets with thin public charging).
Region 3's fleet is roughly 400 M vehicles; 80% is the same figure as
max_replaceable_fraction because in this tape the ceiling and the per-play maximum are the
same constraint seen from two distances.
"""
beta_day_assumption = "Consumer-side only: petrol and diesel spend is converted to physical energy at each product's EXIOBASE price; one third as much electricity is then priced from the baseline household generation mix and its delivery margin. The remaining money re-spends proportionally across the household basket. Direct household emissions move only by the 32.9% road-transport share of Region 3 household Energy Carrier Use: Net Total, rather than treating every household chimney and vehicle as a car. The contract flags freed motoring money re-spending toward air travel as this tape's largest unmodelled risk."

