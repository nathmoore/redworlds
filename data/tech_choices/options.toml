# data/tech_choices/options.toml
#
# One record per game tape. The game sends a tape id, an outcome fraction and a push level;
# everything physical about the tape lives here. Fields follow
# docs/design/red_carbon_contract.md 4.2, plus two of this repo's own:
#
#   beta_day_assumption  - what this record simplifies for the first scored playtest, in a
#                          sentence, so a number in the export can be traced to a choice.
#   regional_ceiling     - the physical maximum for the intervention in the region, with
#     regional_ceiling_basis   its basis stated. The game divides it by the cover magnitude
#     regional_ceiling_unit    to decide how many copies of a tape exist. That mechanic is
#                          still tentative on the game side; the ceiling is recorded anyway
#                          because it is a defensible engine fact either way.
#
# Ceilings are Region 3 (Europe and Central Asia) unless a record says otherwise, and every
# one is an order-of-magnitude authoring anchor, not a forecast. Where a ceiling rests on a
# literature estimate the source is named inline; full citations live in docs/references.md.
#
# BUILD, SWAP and REDUCE are solved. The smart-grid record remains held at its mechanism gate.
#
# Product baskets are NOT here - they live in data/concordances/exiobase_to_scenario.csv,
# keyed by scenario_category. redworlds.jobs.tape_records loads both and validates that
# every product in every basket exists in the table being used.

# ─────────────────────────────────────────────
# REDUCE options — solved for Beta Day
# ─────────────────────────────────────────────

[[reduce]]
key = "eca_buy_less"
label = "Buy Less"
status = "ready"
region_id = 3
scenario_category = "buy_less_basket_a"
matrix_target = ["Y"]
final_demand_categories = ["Final consumption expenditure by households"]
max_reducible_fraction = 0.25
deployment_curve = "reduce_default"
build_years_reference = 0
cover_magnitude = { basket_fraction = 0.014 }
ceiling_cover_key = "basket_fraction"
regional_ceiling = 0.25
regional_ceiling_unit = "fraction of basket A final demand"
regional_ceiling_basis = """
Behavioural, not physical. Basket A is discretionary goods and leisure with housing, food,
household energy and vehicle fuel deliberately protected, so the ceiling is how much of the
discretionary basket a society could forgo and still be recognisably itself. A quarter is
about the gap between current Region 3 discretionary spend per head and that of the
region's own lower-middle income decile — a level people in the region already live at,
which is the most defensible floor available without inventing a preference model.
"""
beta_day_assumption = """
The cut is uniform across all thirteen products in the basket, because the game sends one
outcome fraction. A real behavioural shift would fall unevenly (fast fashion before air
travel). Uniform is the honest reading of a single-number input.

Households only. Government and NPISH buy some of basket A too, but a tape that asks people
to buy less does not ask a health ministry to buy fewer instruments, and cutting those
columns would book a contraction nobody chose.
"""

[[reduce]]
key = "eca_extended_product_lifetimes"
label = "Extended Product Lifetimes"
status = "ready"
region_id = 3
scenario_category = "appliances_and_devices"
matrix_target = ["Y"]
max_reducible_fraction = 1.0
deployment_curve = "reduce_default"
build_years_reference = 0
cover_magnitude = { extra_years_of_life = 1 }
# No ceiling_cover_key: demand removed is N / (life + N), so the cover (+1 yr) is NOT the
# ceiling (+4 yr) divided by four. Going from one to the other needs a second solve with
# weights recomputed at N = 1, which the export marks rather than faking.
cover_scaling = "non-linear"
regional_ceiling = 4
regional_ceiling_unit = "extra years of life per product"
regional_ceiling_basis = """
Physical, from replacement cycles. Adding N years to a product's life removes N / (life + N)
of its annual replacement flow, so the ceiling is the N beyond which returns vanish into
genuine failure rather than replacement. Four years roughly doubles a short-lived product's
life and adds a third to a long-lived one, which is about as far as a full repair-and-reuse
culture reaches.

The ceiling is expressed in *years*, not as a demand fraction, because the fraction differs
per product — that is the whole point of this tape. The per-product fractions at N = 4 live
in the weight column of exiobase_to_scenario.csv, which is why max_reducible_fraction is 1.0
here: the weights already carry the full ceiling.
"""
beta_day_assumption = """
Volume only: fewer units are made and the products' emission intensities are unchanged.
The contract's price-compensation k is therefore 0. The contract is explicit that the
volume effect and the intensity effect must never both be applied or the tonne is
double-counted; volume is the one the Y-side path can represent honestly, and it is the
conservative of the two. Retooling capex (a small GFCF J-curve) is not modelled.

Deployment is linear in the outcome fraction, standing in for the true N / (life + N) curve,
which is mildly concave. The endpoints are exact and partial deployments are slightly
understated. Worth the exactness it buys elsewhere: a linear shock is what lets one solve
serve every outcome fraction.

Mean lifetimes behind the weights are order-of-magnitude and are this tape's largest
uncertainty. They want checking against Vita et al. 2019.
"""

[[reduce]]
key = "eca_remote_work_commuters"
label = "Remote Work"
status = "provisional"
region_id = 3
scenario_category = "commuting_vehicle_fuel"
matrix_target = ["Y", "F_Y"]
max_reducible_fraction = 0.11
deployment_curve = "reduce_default"
build_years_reference = 0
direct_emissions_extension = "impacts"
direct_emissions_driver = "Motor Gasoline"
direct_emissions_share = 0.329
final_demand_categories = ["Final consumption expenditure by households"]
cover_magnitude = { people = 100_000_000, commute_days_avoided_per_week = 1, worker_days_per_week = 100_000_000 }
ceiling_cover_key = "worker_days_per_week"
regional_ceiling = 700_000_000
regional_ceiling_unit = "commuter-days per week avoided (140 M teleworkable workers x 5 days)"
regional_ceiling_basis = """
Behavioural within a physical bound. Dingel & Neiman (2020) find 37% of US jobs can be done
entirely from home, and Sostero et al. (2020) get the same 37% for EU dependent employment
applying their classification; lower-income economies score materially lower, and Region 3
contains several. Shading to ~35% against a Region 3 workforce of roughly 400 M gives
~140 M. The ceiling binds on who can telework at all, not on how many days they choose to.

max_reducible_fraction is that same ceiling seen from the table's side, and the two are in
different units because the tape's ceiling is in people and its shock is in fuel. The chain
is: commuting is ~30% of household car distance (Eurostat passenger mobility puts work
travel at 27% of daily distance in Germany to 47% in Croatia, and annual distance carries
more non-commuting leisure than daily distance does, so the low end is the honest read),
times the ~35% of workers who could stop doing it, giving 0.30 x 0.35 = 0.105, rounded to
0.11 of household motor fuel.
"""
beta_day_assumption = """
This tape opts into the F_Y correction: the 32.9% road-transport share of direct household
emissions moves by Motor Gasoline's own change rather than by the household basket's total.
The share is proxied by Region 3 `Energy Carrier Net TROA / Total`, so the record is
provisional until a fuel-resolved GHG account replaces the energy share. Naming the driving
product is what lets the basket hold the forecourt margin and public transport as well as the fuels — before
weights existed the basket was held to the two fuels alone so that "the basket's change" and
"the fuel's change" were the same number. The correction assumes direct emissions are linear in
fuel spend, so it assumes no rebound in the remaining trips and no shift to a cheaper or
dirtier fuel. Rebound is the contract's stated dominant uncertainty for this tape.
Home heating added by staying in is not netted off here; the contract's 0.13 t/person/day
figure is already net of it, so the two must not be combined without care.

Households only, unlike the other two REDUCE tapes, which cut all three consumption
columns. Commuting fuel is a household purchase; the motor fuel in the government column is
public fleet fuel, which nobody stops buying because office workers stayed home. It matters
for the F_Y correction too: direct household emissions are a household-column quantity, so
cutting the government column would move spend that the correction does not follow.

max_reducible_fraction rests on two external figures rather than on the table, and both are
order-of-magnitude. It also assumes teleworkable workers commute by car at the regional
average, which is unlikely to be exactly true in either direction: office work is more
urban, where car mode share is lower, but office commutes are also longer. See
docs/backlog.md for the work item to firm this up.
"""

# ─────────────────────────────────────────────
# BUILD options — sprint 3 (T5, T6, T8)
# ─────────────────────────────────────────────

[[build]]
key = "eca_nuclear"
label = "Nuclear Power Stations"
status = "ready"
region_id = 3
scenario_category = "electricity_generation"
technology = "nuclear"
technology_sector = "Electricity by nuclear"
matrix_target = ["GFCF_construction_phase", "A_post_build_energy_mix"]
budget_musd_2026_purchaser = 100_000
build_years_reference = 10
deployment_curve = "build_default"
cover_magnitude = { reactors = 10, gw = 12, capacity_factor = 0.9, twh_per_year = 95 }
ceiling_cover_key = "reactors"
regional_ceiling = 650
regional_ceiling_unit = "reactors commissioned in a ten-year mobilisation"
regional_ceiling_basis = """
Industrial, not geological. Uranium supply and sites do not bind at this scale; how fast the
region can pour concrete and forge pressure vessels does.

France went from 15 to 55 reactors in commercial operation during the 1980s - about four grid
connections a year sustained for a decade, off a population of ~55 M, and the fastest buildout
any country has achieved. Scaled per head to Region 3's ~900 M that is ~65 a year, ~650 over
a ten-year mobilisation window. In MacKay's units, ~19 kWh/d per person against his European
consumption stack of 125.

The window is ten years of *commissioning*, which is not the same as build_years_reference:
that is how long one plant takes. France had about six under construction at any moment while
connecting four a year.

What this misses, and would lower it: heavy forging capacity for pressure vessels is
concentrated in a handful of plants worldwide, and is the constraint the literature actually
names. Population scaling is fine while the tape is effectively unlimited at the cohort sizes
the game uses. See docs/design/tape_records.md 5.
"""
beta_day_assumption = "Construction phase is a GFCF injection on the Wood/Wiebe 2018 SI1 split; the operating phase moves Region 3 fossil-electricity A and Y coefficients to nuclear, priced from EXIOBASE's own output and Energy Carrier Supply: Total row."

[[build]]
key = "eca_geothermal"
label = "Geothermal Power"
status = "provisional"
region_id = 3
scenario_category = "electricity_generation"
technology = "geothermal"
technology_sector = "Electricity by Geothermal"
matrix_target = ["GFCF_construction_phase", "A_post_build_energy_mix"]
budget_musd_2026_purchaser = 100_000
build_years_reference = 6
deployment_curve = "build_default"
cover_magnitude = { gw = 13, capacity_factor = 0.8, twh_per_year = 91 }
ceiling_cover_key = "twh_per_year"
regional_ceiling = 180
regional_ceiling_unit = "TWh/yr of new geothermal generation"
regional_ceiling_basis = """
Geological, and hotspot-gated. Conventional high-enthalpy resource in Region 3 is
concentrated in Iceland, Italy, Turkey and the Caucasus; the ceiling above is a proven-
hotspot floor of roughly twice the cover with enhanced geothermal systems left out. If EGS
is later admitted the ceiling rises by an order of magnitude and stops being the binding
constraint, which is why the basis matters more than the number.
"""
beta_day_assumption = "Construction uses the nuclear SI1 capex split as a proxy. Operation moves Region 3 fossil-electricity A and Y coefficients to geothermal. EXIOBASE's geothermal coefficient is reported with the export diagnostic because pymrio issue #72 flags surprising values for this sector and solar PV."

[[build]]
key = "eca_fusion"
label = "Fusion Power"
status = "ready"
region_id = 3
scenario_category = "electricity_generation"
technology = "fusion"
technology_sector = "Electricity by nuclear"
matrix_target = ["GFCF_construction_phase", "A_post_build_energy_mix"]
budget_musd_2026_purchaser = 200_000
build_years_reference = 20
deployment_curve = "build_default"
cover_magnitude = { plants = 10, gw = 12, capacity_factor = 0.9, twh_per_year = 95 }
ceiling_cover_key = "plants"
regional_ceiling = 650
regional_ceiling_unit = "plants commissioned in a ten-year mobilisation"
regional_ceiling_basis = """
The question is *how many could we build if the technology worked as well as anyone credibly
hopes* - not *will it work*, which is the band's job. Asked that way it has an answer, and it
is the same answer as nuclear's: a fusion plant is a large pressure vessel, a great deal of
concrete and a superconducting magnet set, so the binding constraint is heavy forging,
construction and skilled labour, exactly as for fission. France's peak scaled per head to
Region 3 gives ~65 units a year, ~650 over a ten-year push, ~19 kWh/d per person.

Deliberately the same number as nuclear, and deliberately *not* additive with it: both draw
on the same forging capacity, so a region cannot have all of both. See
docs/design/tape_records.md 5, "Ceilings that share a constraint do not stack".

What this leaves out, and where a sceptic should push: no fusion supply chain exists, so a
first decade at France's peak fission rate assumes an industrial ramp nobody has done. That
is a real objection to the *rate*, and the honest place for it is the band rather than a
quietly discounted ceiling - the ceiling answers what is physically buildable, and shading it
for "but probably not" is the failure mode this repo is trying to avoid.
"""
beta_day_assumption = "Modelled as nuclear operation with double capex per GW and a 20-year reference build; the engine gives one honest number and the game's outcome band carries the risk."

