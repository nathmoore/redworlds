label = "Ban Gas Supply"
status = "provisional"
region_id = 3
scenario_category = "residential_heating"
from_technology = "gas_boiler"
to_technology = "heat_pump"
replacement_category = "household_electricity_generation"
delivery_sector = "Distribution and trade services of electricity"
service_energy_ratio = 0.3333333333333333
energy_extension = "satellite"
energy_stressor = "Energy Carrier Supply: Total"
matrix_target = ["Y", "F_Y"]
budget_musd_2026_purchaser = 150_000
build_years_reference = 0
max_replaceable_fraction = 0.9
deployment_curve = "swap_default"
direct_emissions_extension = "impacts"
direct_emissions_driver = "Distribution services of gaseous fuels through mains"
direct_emissions_share = 0.274
